# Publishes a permanent, signed release build with the APK attached. Run it from the Actions tab
# (or the GitHub mobile app), on main, and give the version, e.g. 0.3.0.
#
# Needs four repo secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#
# The release is a normal one (not a pre-release), so delete_prereleases.yml leaves it alone and
# /releases/latest/download/Android-Dock.apk always points at the newest.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, as major.minor.patch (e.g. 0.3.0)'
        required: true
        type: string
      notes:
        description: 'Release notes (leave empty to list the merged PRs)'
        required: false
        type: string
        default: ''

permissions:
  contents: write       # create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 0.3.0, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi
          # Android only updates an app whose version code goes up, so it follows the version.
          echo "VERSION_CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: ./gradlew assembleRelease --no-daemon -PreleaseVersionName="$VERSION" -PreleaseVersionCode="$VERSION_CODE"

      - name: Check the APK is signed
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Android-Dock.apk
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "v$VERSION" Android-Dock.apk \
            --target "$GITHUB_SHA" \
            --title "v$VERSION (alpha)" \
            --latest \
            "${notes[@]}"
